services:
  redis:
    image: redis:7-alpine
    container_name: health_insurance_redis
    restart: always
    ports:
      - "6379:6379"

  # ====================
  # MongoDB (Atlas Local with Vector Search)
  # ====================
  mongodb_health:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb_health_insurance
    restart: always
    ports:
      - "27019:27017"
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=admin
      - MONGODB_INITDB_ROOT_PASSWORD=admin123
      - MONGODB_INITDB_DATABASE=health_insurance
    volumes:
      - mongodb_health_data:/data/db
      - mongodb_mongot_data:/data/mongot

  # ====================
  # Backend API (Node.js)
  # ====================
  server:
    build: ./Server
    container_name: health_insurance_api
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./Server/.env
    depends_on:
      - mongodb_health
      - redis
    volumes:
      - ./Server:/app
    working_dir: /app
    command: npm run dev

  # ====================
  # Frontend (Vite)
  # ====================
  client:
    build: ./Clients
    container_name: health_insurance_client
    restart: always
    ports:
      - "3000:5173"
    environment:
      REACT_APP_API_URL: http://server:3001
    depends_on:
      - server
    volumes:
      - ./Clients:/app
    working_dir: /app
    command: npm start
    stdin_open: true
    tty: true

volumes:
  mongodb_health_data:
  mongodb_mongot_data:
