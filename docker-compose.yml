services:
  redis:
    image: redis:7-alpine
    container_name: health_insurance_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ====================
  # MongoDB (Atlas Local with Vector Search)
  # ====================
  mongodb_health:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb_health_insurance
    hostname: mongodb_health
    restart: always
    ports:
      - "27019:27017"
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the root .env file}
      - MONGODB_INITDB_DATABASE=health_insurance
    volumes:
      - mongodb_health_data:/data/db
      - mongodb_health_config:/data/configdb
      - mongodb_mongot_data:/data/mongot

  # ====================
  # Backend API (Node.js)
  # ====================
  server:
    build: ./Server
    container_name: health_insurance_api
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./Server/.env
    depends_on:
      redis:
        condition: service_healthy
      mongodb_health:
        condition: service_healthy
    volumes:
      - ./Server:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev

  # ====================
  # Frontend (Vite)
  # ====================
  client:
    build: ./Clients
    container_name: health_insurance_client
    restart: always
    ports:
      - "3000:5173"
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    depends_on:
      - server
    volumes:
      - ./Clients:/app
      - /app/node_modules
    working_dir: /app
    command: npm start
    stdin_open: true
    tty: true

volumes:
  mongodb_health_data:
  mongodb_health_config:
  mongodb_mongot_data:
